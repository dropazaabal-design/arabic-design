<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=Amiri&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
.page{width:1080px;height:1350px;font-family:Tajawal,sans-serif;background:#0B1F2A;color:#F5EFE0;
 position:relative;overflow:hidden;padding:88px 76px;display:flex;flex-direction:column;justify-content:space-between}
.glow{position:absolute;inset:0;background:radial-gradient(1100px 680px at 82% -8%,#1C6B5A 0%,transparent 62%),radial-gradient(820px 620px at 6% 104%,#8C2F39 0%,transparent 58%)}
.pat{position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2796%27%20height%3D%2796%27%3E%3Cpolygon%20points%3D%2792.2%2C48.0%2064.9%2C55.0%2079.2%2C79.2%2055.0%2C64.9%2048.0%2C92.2%2041.0%2C64.9%2016.8%2C79.2%2031.1%2C55.0%203.8%2C48.0%2031.1%2C41.0%2016.8%2C16.8%2041.0%2C31.1%2048.0%2C3.8%2055.0%2C31.1%2079.2%2C16.8%2064.9%2C41.0%27%20fill%3D%27none%27%20stroke%3D%27%23C9A227%27%20stroke-width%3D%271.1%27%2F%3E%3C%2Fsvg%3E");opacity:.14}
.eyebrow{font-size:26px;color:#C9A227;font-weight:700;position:relative}
h1{font-size:132px;line-height:1.18;font-weight:700;margin:28px 0 0;color:#F0E3B8;position:relative}
p{font-family:Amiri,serif;font-size:41px;line-height:1.85;color:#D8CEB8;max-width:19ch;position:relative}
.cards{display:flex;gap:20px;position:relative}
.card{flex:1;background:rgba(245,239,224,.06);border:1px solid rgba(201,162,39,.32);border-radius:20px;padding:26px 22px}
.num{font-size:52px;font-weight:700;color:#C9A227;line-height:1}
.lbl{font-size:23px;color:#BDB49F;margin-top:10px}
footer{display:flex;justify-content:space-between;font-size:24px;color:#8E876F;position:relative}
</style></head><body>
<div class="page" data-document-role="page" data-label="الجمال في التفصيل">
 <div class="glow"></div><div class="pat"></div>
 <div><div class="eyebrow">سلسلة الإتقان</div><h1>الجمالُ<br>في التفصيل</h1></div>
 <p>التصميمُ العربيُّ لا يُترجَم، بل يُبنى من حروفه: من اتّصالِ الحرف، ومن فراغٍ يتنفّس، ومن إيقاعٍ يقرأُ من اليمين.</p>
 <div class="cards">
  <div class="card"><div class="num">٠١</div><div class="lbl">الحرف المتّصل</div></div>
  <div class="card"><div class="num">٠٢</div><div class="lbl">الفراغ الحيّ</div></div>
  <div class="card"><div class="num">٠٣</div><div class="lbl">الإيقاع اليمينيّ</div></div>
 </div>
 <footer><span>٢٠٢٦</span><span>استوديو أزابال</span></footer>
</div></body></html>
