<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
.page{width:1080px;height:1350px;position:relative;overflow:hidden;
 padding:76px;display:flex;flex-direction:column;justify-content:space-between;
 font-family:'Tajawal',sans-serif;background:#0B1F2A;color:#F5EFE0}
.glow{position:absolute;inset:0;background:radial-gradient(1100px 680px at 82% -8%,#1C6B5A 0%,transparent 62%),radial-gradient(820px 620px at 6% 104%,#8C2F39 0%,transparent 58%)}
.pat{position:absolute;inset:0;background-image:url("https://raw.githubusercontent.com/dropazaabal-design/arabic-design/claude/wonderful-lamport-ep2m3e/p/1abfpol/pattern.svg");background-size:cover;background-repeat:no-repeat;opacity:0.16}
.eyebrow{position:relative;font-size:25px;font-weight:700;color:#C9A227}
h1{position:relative;font-size:127px;line-height:1.18;font-weight:700;
 margin-top:25px;color:#F5EFE0}
p{position:relative;font-family:'Amiri',serif;font-size:40px;
 line-height:1.8;color:#D8CEB8;max-width:19ch}
.cards{position:relative;display:flex;gap:21px}
.card{flex:1;border:1px solid #C9A22755;border-radius:21px;
 padding:27px 23px}
.num{font-size:50px;font-weight:700;color:#C9A227;line-height:1}
.lbl{font-size:23px;line-height:1.8;color:#BDB49F;
 margin-top:10px}
footer{position:relative;display:flex;justify-content:space-between;
 font-size:24px;color:#BDB49F}
</style></head><body>
<div class="page" data-document-role="page" data-label="الجمال في التفصيل">
<div class="glow"></div><div class="pat"></div>
<div class="eyebrow">‫سلسلة الإتقان‬</div>
<h1>‫الجمال‬<br>‫في التفصيل‬</h1>
<p>‫التصميم العربيّ لا يُترجَم، بل يُبنى من حروفه: من اتّصال الحرف، ومن فراغ يتنفّس.‬</p>
<div class="cards"><div class="card"><div class="num">٠١</div><div class="lbl">‫الحرف المتّصل‬</div></div><div class="card"><div class="num">٠٢</div><div class="lbl">‫الفراغ الحيّ‬</div></div><div class="card"><div class="num">٠٣</div><div class="lbl">‫الإيقاع اليمينيّ‬</div></div></div>
<footer><span>٢٠٢٦</span><span>‫استوديو أزابال‬</span></footer>
</div></body></html>
