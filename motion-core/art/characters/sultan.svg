<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sultan, the editable art source for the SVGR rig (motion-core/tools/svgr-build.mjs).
  Bind pose: standing, facing right (three-quarter), arms hanging; origin = ground between the feet.
  Every top-level <g data-part> is one moving part, drawn where it sits in the bind pose.
  data-pivot = the joint it turns about (character coordinates); data-anchor = where a held object goes.
  Colours are CSS variables with defaults, so any SVG editor shows the real colours and the rig can recolour.
  Skeleton matches motion-core Person.tsx: hip y −146, shoulders y −268/−266, upper arm 70, forearm 64, thigh 74, shin 72.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-130 -440 260 470" width="260" height="470">
